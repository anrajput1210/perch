[package]
name = "perch"
version = "0.0.1"
edition = "2021"
default-run = "perch"

[lib]
name = "perch_core"
path = "src/lib.rs"

[[bin]]
name = "perch"
path = "src/main.rs"

[[bin]]
name = "perch-hook"
path = "src/bin/perch-hook.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "rt-multi-thread", "time"] }

ureq = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Media_Control", "Foundation", "Foundation_Collections", "Storage", "Storage_Streams", "ApplicationModel_DataTransfer",
  "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
  "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell",
] }
windows-collections = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSSharingService", "NSWindow", "NSResponder", "NSGraphics"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[profile.release]
strip = true
lto = true

# Builds Perch for Windows and macOS side by side: checks, Rust tests, then the installer / app bundles.
# Pushing a tag like v0.0.1 also publishes them as a GitHub Release, which `npx github:anrajput1210/perch` installs.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create the release and upload its files

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest # Apple Silicon
          - os: macos-latest # Intel, cross-compiled (GitHub retired its Intel Mac machines)
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: cargo test
        working-directory: src-tauri
      - run: npm run dist
        shell: bash
        env:
          TARGET: ${{ matrix.target }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ -n "$TARGET" ]; then arch=x64; dir=src-tauri/target/$TARGET/release/bundle; else arch=aarch64; dir=src-tauri/target/release/bundle; fi
          app=$dir/macos/Perch.app
          codesign --verify --deep --strict "$app" # ad-hoc signed: Apple Silicon refuses unsigned code
          mkdir -p out
          tar -czf "out/Perch_macos_${arch}.app.tar.gz" -C "$(dirname "$app")" Perch.app
          cp "$dir"/dmg/*.dmg "out/Perch_macos_${arch}.dmg"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir -p out && cp src-tauri/target/release/bundle/nsis/*-setup.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: perch-${{ matrix.os }}${{ matrix.target && '-intel' || '' }}
          path: out/*

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Perch $GITHUB_REF_NAME" \
            --notes "Install: \`npx github:anrajput1210/perch\`" 2>/dev/null || true # another job may have made it
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
